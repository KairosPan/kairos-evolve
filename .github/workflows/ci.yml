name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install PostgreSQL 16 (for pytest-postgresql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          # Make pg_ctl + initdb discoverable on PATH for pytest-postgresql
          echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH

      - name: Install deps
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v
