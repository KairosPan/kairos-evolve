[project]
name = "kairos-evolve"
version = "0.1.0"
description = "Self-evolution for Kairos legal agent studio — extracted L1-L6 optimizer with CLI + API surfaces"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kairos contributors" }]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "cryptography>=43",
]

[project.optional-dependencies]
cli = [
  "typer>=0.12",
  "rich>=13",
  "dspy-ai>=3.0",
  "openai>=1.0",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "inngest>=0.4",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
kairos-evolve = "kairos_evolve.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/kairos_evolve"]

[tool.hatch.build.targets.wheel.sources]
"packages/kairos_evolve" = "kairos_evolve"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
